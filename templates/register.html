{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-lg border-0">
      <div class="card-body p-5">
        <h3 class="text-center fw-bold mb-4">Create Account</h3>
        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label class="form-label text-muted small text-uppercase fw-bold">Choose Username</label>
            <input class="form-control form-control-lg" name="username" required>
          </div>
          <div class="mb-4">
            <label class="form-label text-muted small text-uppercase fw-bold">Create Password</label>
            <input type="password" class="form-control form-control-lg" name="password" required>
          </div>
          <button class="btn btn-dark btn-lg w-100 shadow-sm" type="submit">Sign Up</button>
        </form>
        <div class="mt-4 text-center">
          <span class="text-muted">Already a member?</span> 
          <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold">Log In</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
