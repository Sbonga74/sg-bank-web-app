{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-lg border-0">
      <div class="card-body p-5">
        <h3 class="text-center fw-bold mb-4">Welcome Back</h3>
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label text-muted small text-uppercase fw-bold">Username</label>
            <input class="form-control form-control-lg" name="username" placeholder="Enter your username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label text-muted small text-uppercase fw-bold">Password</label>
            <input type="password" class="form-control form-control-lg" name="password" placeholder="••••••••" required>
          </div>
          <button class="btn btn-primary btn-lg w-100 shadow-sm" type="submit">Log In</button>
        </form>
        <div class="mt-4 text-center">
          <span class="text-muted">Don't have an account?</span> 
          <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold">Register</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
